<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled WebPage</title>
</head>
<body>
    <center><canvas height="500px" width="1000px" id="canvas" style="border: 1px solid black; border-radius: 5px;"></canvas></center>
</body>
<script>
    const canvas = document.getElementById("canvas")
    const ctx = canvas.getContext("2d")
    ctx.fillStyle = "blue"
    ctx.fillRect(20,20,150,200)
    ctx.strokeStyle = "red"
    ctx.lineWidth = 5
    ctx.strokeRect(200,20,150,100)
    ctx.beginPath();
    ctx.moveTo(50,300)
    ctx.lineTo(200,300)
    ctx.strokeStyle = "green"
    ctx.lineWidth = 5
    ctx.stroke()
    ctx.beginPath()
    ctx.arc(300,200,50,0,Math.PI*2)
    ctx.fill()
    ctx.beginPath()
    ctx.fillText("Dharani Pathivada", 500, 250); 
</script>
</html>
